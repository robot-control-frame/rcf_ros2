name: prepare-release

# 手动触发：升版本号 + 生成 CHANGELOG + 提交 + 打 tag + push。
# tag push 之后由 release.yml 接着跑 bloom-release。
#
# 注意：用 GITHUB_TOKEN 推的 tag 不会触发其他 workflow，所以这里必须用 PAT
# （secrets.RELEASE_TOKEN），否则 release.yml 不会启动。

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本号变化"
        required: true
        type: choice
        default: minor
        options:
          - minor
          - patch

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ros:jazzy
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: 安装 catkin_pkg / catkin 发布工具
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-catkin-pkg python3-catkin-pkg-modules git

      - name: 生成 CHANGELOG
        shell: bash
        run: |
          git config user.name "rcf release bot"
          git config user.email "liaolunjia@gmail.com"
          catkin_generate_changelog --all --non-interactive || true
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: 更新 CHANGELOG"
          fi

      - name: 升版本号并打 tag
        id: bump
        shell: bash
        run: |
          catkin_prepare_release --bump "${{ inputs.bump }}" --no-push -y -t v
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' rcf_common/package.xml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next version: $version"

      - name: Push 提交与 tag
        shell: bash
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
          echo "::notice::pushed v${{ steps.bump.outputs.version }}，release.yml 会自动开始发布"
